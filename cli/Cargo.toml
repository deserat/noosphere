[package]
name = "noosphere-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noosphere"
path = "src/main.rs"

[dependencies]
# TUI Framework
ratatui = "0.26"
crossterm = "0.27"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP Client (using rustls instead of native-tls to avoid OpenSSL system dependency)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# CLI Argument Parsing
clap = { version = "4.4", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Testing utilities
mockito = "1.2"
