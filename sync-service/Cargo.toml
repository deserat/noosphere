[package]
name = "noosphere-sync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noosphere-sync"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP Client (using rustls instead of native-tls to avoid OpenSSL system dependency)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# File Watching
notify = "6.1"

# Content Hashing
sha2 = "0.10"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
