[package]
name = "noosphere-sync"
version = "0.1.0"
edition = "2021"

[lib]
name = "noosphere_sync"
path = "src/lib.rs"

[[bin]]
name = "noosphere-sync"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP Client (using rustls instead of native-tls to avoid OpenSSL system dependency)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# File Watching
notify = "6.1"

# Content Hashing
sha2 = "0.10"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"

# Vault Utilities
# YAML frontmatter parsing
gray_matter = "0.2"

# File locking
fs2 = "0.4"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Temporary files (atomic writes)
tempfile = "3.0"
shellexpand = "3.1.1"

[dev-dependencies]
# File timestamp manipulation for testing
filetime = "0.2"
